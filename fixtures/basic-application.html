<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApplyKit fixture: basic application</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        margin-top: 1rem;
      }
      input {
        display: block;
        width: 100%;
        padding: 0.4rem;
        box-sizing: border-box;
      }
      button {
        margin-top: 1.5rem;
      }
      output {
        display: block;
        margin-top: 1.5rem;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <!--
      Controlled test page for the autofill proof of concept.
      Used by unit tests (src/autofill/*.test.ts) and for manual testing
      via `pnpm fixtures`.
    -->
    <h1>Basic application</h1>
    <form id="application" action="/submitted" method="post">
      <label for="first-name">First name</label>
      <input id="first-name" name="first_name" type="text" />

      <label for="last-name">Last name</label>
      <input id="last-name" name="last_name" type="text" />

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" />

      <input type="hidden" name="job_id" value="fixture-001" />

      <button type="submit">Submit application</button>
    </form>

    <output id="status">Submitted: no · input events: 0</output>

    <script>
      // Reports page-observed behaviour so manual tests can confirm that
      // autofill dispatches input events and never submits the form.
      const form = document.getElementById('application');
      const status = document.getElementById('status');
      let submitted = false;
      let inputEvents = 0;
      const render = () => {
        status.textContent = `Submitted: ${submitted ? 'YES' : 'no'} · input events: ${inputEvents}`;
      };
      form.addEventListener('input', () => {
        inputEvents += 1;
        render();
      });
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        submitted = true;
        render();
      });
    </script>
  </body>
</html>
