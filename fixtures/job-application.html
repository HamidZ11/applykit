<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Senior Product Designer · Halden Freight Careers</title>
    <link rel="icon" href="data:," />
    <!--
      Fictional job application used to evaluate ApplyKit's panel against a
      realistic form. The company, role and every detail are invented.
      Only first name, last name and email are fillable by the current engine;
      the other fields deliberately exercise unrecognised and unsupported
      controls. Used by e2e tests, design capture and manual testing.
    -->
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2328;
        --muted: #59636e;
        --line: #d1d9e0;
        --brand: #0f6b5c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: var(--ink);
        background: #f6f8fa;
      }
      header {
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .bar {
        max-width: 720px;
        margin: 0 auto;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      .logo {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: var(--brand);
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
        margin: 0 0 6px;
      }
      .meta {
        color: var(--muted);
        margin: 0 0 28px;
      }
      form {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 28px 28px;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 24px 0 0;
      }
      fieldset > legend {
        font-size: 17px;
        font-weight: 600;
        padding: 0;
        margin-bottom: 4px;
      }
      fieldset fieldset > legend {
        font-size: 15px;
        font-weight: 500;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
      label {
        display: block;
        margin-top: 14px;
        font-weight: 500;
      }
      .req {
        color: #cf222e;
      }
      input:not([type='checkbox'], [type='radio']),
      select,
      textarea {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 8px 10px;
        font: inherit;
        color: inherit;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      .choice {
        display: flex;
        gap: 8px;
        align-items: center;
        font-weight: 400;
        margin-top: 10px;
      }
      .hint {
        color: var(--muted);
        font-size: 13px;
        margin: 4px 0 0;
      }
      button {
        margin-top: 28px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      output {
        display: block;
        margin-top: 24px;
        color: var(--muted);
        font:
          12px/1.4 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar"><span class="logo"></span>Halden Freight</div>
    </header>
    <main>
      <h1>Senior Product Designer</h1>
      <p class="meta">London · Hybrid · Full-time · Design</p>

      <form id="application" action="/submitted" method="post">
        <fieldset>
          <legend>Personal information</legend>
          <div class="row">
            <div>
              <label for="given">First name <span class="req">*</span></label>
              <input
                id="given"
                name="candidate[given]"
                autocomplete="given-name"
                required
              />
            </div>
            <div>
              <label for="family">Last name <span class="req">*</span></label>
              <input id="family" name="candidate[family]" required />
            </div>
          </div>
          <label for="preferred">Preferred name</label>
          <input id="preferred" name="candidate[preferred]" />
          <div class="row">
            <div>
              <label for="email">Email <span class="req">*</span></label>
              <input id="email" name="candidate[email]" type="email" required />
            </div>
            <div>
              <label for="phone">Phone <span class="req">*</span></label>
              <input id="phone" name="candidate[phone]" type="tel" required />
            </div>
          </div>
          <label for="location"
            >Current location <span class="req">*</span></label
          >
          <input
            id="location"
            name="candidate[location]"
            placeholder="City, country"
            required
          />
        </fieldset>

        <fieldset>
          <legend>Experience</legend>
          <label for="resume">Résumé / CV <span class="req">*</span></label>
          <input
            id="resume"
            name="resume"
            type="file"
            accept=".pdf,.doc,.docx"
            required
          />
          <p class="hint">PDF or Word, up to 10 MB.</p>
          <label for="portfolio"
            >Portfolio URL <span class="req">*</span></label
          >
          <input id="portfolio" name="portfolio" type="url" required />
          <label for="linkedin">LinkedIn profile</label>
          <input id="linkedin" name="linkedin" type="url" />
          <label for="cover">Cover letter</label>
          <textarea id="cover" name="cover_letter"></textarea>
        </fieldset>

        <fieldset>
          <legend>Application questions</legend>
          <fieldset>
            <legend>
              Do you have the right to work in the UK?
              <span class="req">*</span>
            </legend>
            <label class="choice"
              ><input type="radio" name="right_to_work" value="yes" required />
              Yes</label
            >
            <label class="choice"
              ><input type="radio" name="right_to_work" value="no" /> No</label
            >
          </fieldset>
          <label for="notice">Notice period <span class="req">*</span></label>
          <select id="notice" name="notice_period" required>
            <option value="">Select…</option>
            <option>Immediately available</option>
            <option>Up to 1 month</option>
            <option>1–3 months</option>
            <option>More than 3 months</option>
          </select>
          <label for="salary">Salary expectation (GBP)</label>
          <input id="salary" name="salary_expectation" inputmode="numeric" />
          <label for="source">How did you hear about this role?</label>
          <select id="source" name="source">
            <option value="">Select…</option>
            <option>Company website</option>
            <option>LinkedIn</option>
            <option>Referral</option>
            <option>Other</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Privacy</legend>
          <label class="choice">
            <input type="checkbox" name="privacy_consent" required />
            I have read the candidate privacy notice <span class="req">*</span>
          </label>
        </fieldset>

        <input type="hidden" name="requisition" value="HF-2026-0142" />
        <button type="submit">Submit application</button>
      </form>

      <output id="status">Fixture · submitted: no · input events: 0</output>
    </main>

    <script>
      // Lets tests and reviewers confirm what the page observed.
      const form = document.getElementById('application');
      const status = document.getElementById('status');
      let submitted = false;
      let inputEvents = 0;
      const render = () => {
        status.textContent = `Fixture · submitted: ${submitted ? 'YES' : 'no'} · input events: ${inputEvents}`;
      };
      form.addEventListener('input', () => {
        inputEvents += 1;
        render();
      });
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        submitted = true;
        render();
      });
    </script>
  </body>
</html>
